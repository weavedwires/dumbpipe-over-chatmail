# Build release binaries for the desktop platforms and for Android (the same
# targets as ./build-release.sh) and attach them to a GitHub release.
#
# Targets built on GitHub-hosted runners (no self-hosted runners required):
#   - Linux x86_64          (x86_64-unknown-linux-gnu)
#   - Windows x86_64        (x86_64-pc-windows-msvc)
#   - macOS aarch64         (aarch64-apple-darwin)
#   - macOS x86_64          (x86_64-apple-darwin)
#   - Android arm64-v8a     (aarch64-linux-android)
#   - Android armeabi-v7a   (armv7-linux-androideabi)
#   - Android x86_64        (x86_64-linux-android)
#   - Android x86           (i686-linux-android)
#
# The Android ABIs reuse the repo's own build-release.sh, fed with an NDK from
# the nttld/setup-ndk action.

name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (tag name, e.g. v0.40.0)"
        required: true

env:
  BIN_NAME: dumbpipe
  # One source of truth for the version across jobs.
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.release_version }}

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        shell: bash
        run: cargo build --verbose --release --target ${{ matrix.target }}
      - name: Build archive
        shell: bash
        run: |
          exe="${{ runner.os == 'Windows' && 'dumbpipe.exe' || 'dumbpipe' }}"
          staging="dumbpipe-${{ matrix.name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/$exe" "$staging/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command \
              "Compress-Archive -Path '$staging/*' -DestinationPath '$staging.zip'"
            echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
          else
            tar czf "$staging.tar.gz" -C "$staging" .
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  android:
    name: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android"
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
      - name: Build Android binaries
        shell: bash
        # ring builds C asm for Android, so `perl` must be available (it is on
        # hosted runners). build-release.sh builds all 4 Android ABIs.
        run: ./build-release.sh --ndk "${{ steps.setup-ndk.outputs.ndk-path }}"
      - name: Collect Android artifacts
        shell: bash
        run: |
          mkdir -p android-dist
          for f in dist/dumbpipe-android-*; do
            mv "$f" "android-dist/${f#dist/}"
          done
          ls -lh android-dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: android-dist/
          if-no-files-found: error

  release:
    name: release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Version the artifacts and write checksums
        shell: bash
        run: |
          mkdir -p release-assets
          for f in artifacts/*/*; do
            base="$(basename "$f")"
            mv "$f" "release-assets/dumbpipe-$RELEASE_VERSION-$base"
          done
          find release-assets -type f -name 'dumbpipe-*' | sort \
            | xargs sha256sum | sed -e 's|release-assets/| |' > release-assets/checksums.txt
          cat release-assets/checksums.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**