[package]
name = "dumbpipe"
version = "0.39.0"
edition = "2021"
authors = ["Rüdiger Klaehn <rklaehn@protonmail.com>", "n0 team"]
keywords = ["netcat", "cli", "network", "p2p", "holepunching"]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/weavedwires/dumbpipe-over-chatmail"
description = "A cli tool to pipe data over the network, with NAT hole punching"
readme = "README.md"

# Sadly this also needs to be updated in .github/workflows/ci.yml
rust-version = "1.91"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4.10", features = ["derive"] }
data-encoding = "2.9.0"
hex = "0.4.3"
iroh = { version = "0.35", default-features = false }
iroh-base = { version = "0.35", features = ["ticket"] }
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1.34.0", features = ["full"] }
tokio-util = "0.7.10"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
duct = "1.1.1"
nix = { version = "0.31", features = ["signal", "process"] }
rand = "0.8"
tempfile = "3.8"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
debug = "none"
strip = true
